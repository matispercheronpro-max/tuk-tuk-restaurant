<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Carte QR de table Tuk Tuk - A5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5efe6;--bg-2:#efe7da;--surface:#fbf8f1;--ink:#2b2420;--ink-2:#6f655c;
    --line:#e4dacb;--accent:#c0613a;--accent-2:#a44e2c;--accent-ink:#fdf6ef;--accent-soft:#efd9c8;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Bricolage Grotesque',sans-serif;background:#ddd;}
  @page{size:A5 portrait;margin:0;}
  @media print{body{background:none;}}
  .page{
    width:559px;height:794px;background:var(--bg);color:var(--ink);
    position:relative;overflow:hidden;
    padding:40px 42px 34px;display:flex;flex-direction:column;align-items:center;text-align:center;
  }
  .kicker{font-size:11px;font-weight:800;letter-spacing:.26em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;}
  .title{font-size:1.5rem;font-weight:700;letter-spacing:-.02em;line-height:1.12;color:var(--ink);}
  .divider{width:34px;height:1.5px;background:var(--accent);opacity:.55;}
  .qr-card{
    background:#fff;border:1px solid var(--line);border-radius:10px;
    padding:16px;box-shadow:0 10px 26px rgba(43,36,32,.07);
  }
  .qr-card svg{width:214px;height:214px;display:block;}
  .scan-label{font-size:.98rem;font-weight:700;color:var(--ink);line-height:1.4;}
  .scan-sub{font-size:12px;color:var(--ink-2);line-height:1.55;max-width:320px;}
  .comptoir{
    width:100%;background:var(--accent);color:var(--accent-ink);
    padding:13px 18px;border-radius:4px;
    font-size:1.02rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
  }
  .comptoir small{display:block;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:none;color:rgba(253,246,239,.82);margin-top:3px;}
  .footer{width:100%;border-top:1px solid var(--line);padding-top:14px;font-size:11px;color:var(--ink-2);line-height:1.8;}
  .footer strong{color:var(--ink);font-weight:700;}
</style>
</head>
<body>

<div class="page" id="carte-qr">

  <!-- En-tête : logo -->
  <img src="../assets/logo.png" alt="Tuk Tuk" style="width:290px;height:auto;display:block;">

  <!-- Titre -->
  <div style="font-size:1.32rem;color:var(--ink);font-weight:600;letter-spacing:-.01em;margin-top:34px;">Consulter notre carte</div>

  </div>

  <div class="scan-label" style="margin-top:2px;">Scannez le QR code pour voir toute notre carte</div>

  <!-- Commande au comptoir -->

    Commande au comptoir
  </div>

  <!-- Infos -->
  <div class="footer" style="margin-top:auto;">

</div>

</body>
</html>
